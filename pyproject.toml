[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EthioBBPE"
version = "2.0.0"
description = "Enterprise-grade Amharic & Ge'ez Biblical Text Tokenizer with Byte Pair Encoding"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Nexuss0781", email = "nexuss0781@gmail.com"}
]
maintainers = [
    {name = "Nexuss0781", email = "nexuss0781@gmail.com"}
]
keywords = [
    "amharic",
    "geez",
    "tokenizer",
    "nlp",
    "ethiopic",
    "biblical",
    "bpe",
    "huggingface",
    "african-languages",
    "llm",
    "transformer"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed"
]
requires-python = ">=3.9"
dependencies = [
    "tokenizers>=0.20.0,<0.22",
    "huggingface-hub>=0.25.0,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0"
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "myst-parser>=3.0.0"
]
all = [
    "EthioBBPE[dev,docs]"
]

[project.urls]
Homepage = "https://github.com/nexuss0781/Ethio_BBPE"
Repository = "https://github.com/nexuss0781/Ethio_BBPE.git"
Documentation = "https://github.com/nexuss0781/Ethio_BBPE#readme"
Issues = "https://github.com/nexuss0781/Ethio_BBPE/issues"
HuggingFace = "https://huggingface.co/Nexuss0781/Ethio-BBPE"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ethiobbpe*"]

[tool.setuptools.package-data]
"ethiobbpe" = ["*.json", "*.json.gz", "*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
  | \.eggs
  | *.egg-info
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
skip = [".git", ".venv", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
show_traceback = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "tokenizers.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --cov=ethiobbpe --cov-report=term-missing --cov-report=html --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ethiobbpe"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 80
